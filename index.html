<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Book of Bill</title>
    <style>
        /* إعدادات الصفحة والخلفية المظلمة */
        body {
            background-color: #0a0a0a;
            color: #ffcc00; /* أصفر بيل سايفر */
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: radial-gradient(#330000 5%, #0a0a0a 70%); /* إضاءة حمراء خافتة */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }

        /* عنوان الموقع مع تأثير الخلل (Glitch) */
        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 2px 2px 10px #ff0000;
            animation: glitch 1.5s infinite;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.5rem;
            max-width: 600px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 40px;
        }

        /* تصميم بيل سايفر (المثلث) باستخدام CSS */
        .bill-cipher {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 173px solid #ffcc00;
            position: relative;
            animation: float 3s ease-in-out infinite; /* تأثير الطفو */
            cursor: pointer;
        }

        /* تصميم العين */
        .eye {
            position: absolute;
            top: 80px;
            left: -30px;
            width: 60px;
            height: 30px;
            background: white;
            border-radius: 50%;
            border: 3px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* بؤبؤ العين الذي يتحرك */
        .pupil {
            width: 12px;
            height: 22px;
            background: black;
            border-radius: 50%;
            animation: lookAround 4s infinite;
        }

        /* النص المشفر المخفي */
        .cipher-text {
            margin-top: 40px;
            font-size: 1.2rem;
            color: #ff0000;
            letter-spacing: 4px;
            opacity: 0; /* مخفي افتراضياً */
            transition: opacity 1s ease;
            font-weight: bold;
        }

        /* -- الحركات (Animations) -- */
        @keyframes glitch {
            0% { text-shadow: 2px 2px 10px #ff0000; transform: translate(0); }
            20% { text-shadow: -2px -2px 10px #ffcc00; transform: translate(-2px, 2px); }
            40% { text-shadow: 2px -2px 10px #000; transform: translate(2px, -2px); }
            60% { text-shadow: -2px 2px 10px #ff0000; transform: translate(-2px, -2px); }
            80% { text-shadow: 2px 2px 10px #ffcc00; transform: translate(2px, 2px); }
            100% { text-shadow: 2px 2px 10px #ff0000; transform: translate(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes lookAround {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }
    </style>
</head>
<body>

    <h1>The Book of Bill</h1>
    <p>الحقيقة وهم، والكون هولوغرام، اشترِ الذهب، وداعاً!</p>

    <div class="bill-cipher" onclick="revealSecret()">
        <div class="eye">
            <div class="pupil"></div>
        </div>
    </div>

    <p class="cipher-text" id="secretMsg">WKH XQLYHUVH LV D KRORJUDP <br> (أنا أراقبك...)</p>

    <script>
        // سكريبت بسيط لتغيير لون الخلفية وإظهار نص مخفي عند الضغط على بيل
        function revealSecret() {
            const msg = document.getElementById('secretMsg');
            
            if (msg.style.opacity === '1') {
                msg.style.opacity = '0';
                document.body.style.backgroundImage = 'radial-gradient(#330000 5%, #0a0a0a 70%)';
            } else {
                msg.style.opacity = '1';
                document.body.style.backgroundImage = 'radial-gradient(#660000 5%, #000000 90%)';
                alert("لقد عقدت صفقة للتو... لا تراجع الآن!");
            }
        }
    </script>

</body>
</html>
