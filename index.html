<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER_GLOBAL // SYSTEM_ACCESS</title>
    <style>
        :root {
            --bg-dark: #000000;
            --panel-amber: #cca300;
            --text-gold: #ffcc00;
            --text-dim: #8a816f;
            --blood-red: #b30000;
        }

        body { background-color: #000; color: var(--text-dim); font-family: 'Courier New', Courier, monospace; margin: 0; overflow: hidden; height: 100vh; }

        /* تأثير تشغيل التلفاز */
        #boot-screen {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index: 10000;
            background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            animation: start-tv 1.5s ease-out forwards;
        }
        @keyframes start-tv {
            0% { opacity: 1; filter: brightness(20); }
            100% { opacity: 0; pointer-events: none; }
        }

        .disclaimer { border: 2px solid var(--blood-red); padding: 40px; text-align: center; max-width: 600px; }
        .btn-accept { padding: 15px 30px; background: var(--blood-red); color: #fff; cursor: pointer; border: none; margin-top: 20px; font-weight: bold; }

        /* واجهة الموقع */
        #main-ui { display: none; height: 100vh; display: grid; grid-template-columns: 300px 1fr; }
        .control-panel { border-right: 2px solid #332900; padding: 20px; overflow-y: auto; }
        .nav-link { display: block; padding: 12px; margin-bottom: 10px; border: 1px dashed #332900; color: var(--text-dim); cursor: pointer; }
        .nav-link:hover { background: var(--panel-amber); color: #000; }
        .content-area { padding: 40px; overflow-y: auto; background: url('https://i.imgur.com/your-bill-cipher-bg.png'); } /* أضف رابط صورة لبيل هنا */

        .bill-img { width: 200px; float: right; border: 2px solid var(--text-gold); filter: sepia(1); }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div class="disclaimer">
            <h1 style="color:var(--blood-red)">WARNING</h1>
            <p>YOU ARE ACCESSING A PRIVATE NETWORK OWNED BY CIPHER GLOBAL. BY PROCEEDING, YOU SURRENDER YOUR RIGHT TO EXISTENCE.</p>
            <button class="btn-accept" onclick="startSystem()">ACCEPT_THE_DEAL</button>
        </div>
    </div>

    <div id="main-ui">
        <aside class="control-panel">
            <h2 style="color:var(--text-gold)">SYSTEM_NODES</h2>
            <button class="nav-link" onclick="showContent('discover')">▲ DISCOVER</button>
            <button class="nav-link" onclick="showContent('handbook')">▲ HANDBOOK</button>
            <button class="nav-link" onclick="showContent('burnout')">▲ OVERRIDE_SYSTEM</button>
        </aside>

        <main class="content-area" id="content">
            <h2>WELCOME TO THE WIRED</h2>
            <p>Select a node to begin the ritual of data assimilation.</p>
            <img src="https://i.pinimg.com/originals/17/a3/0c/17a30cfb0e9d682496a603a1158652d3.png" style="width:300px">
        </main>
    </div>

    <script>
        function startSystem() {
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'grid';
        }

        function showContent(id) {
            const content = {
                'discover': `<h2>DISCOVER_THE_CULT</h2><img src="https://static.wikia.nocookie.net/gravityfalls/images/e/e9/Bill_Cipher_Pines.png" class="bill-img"><p>CIPHER GLOBAL is not a company, it is a living entity. We feed on digital footprints. Every click you make strengthens the one-eyed god's grip on your hardware.</p>`,
                'handbook': `<h2>EMPLOYEE_HANDBOOK</h2><p>Rule 1: Never look into the eye of the server terminal. Rule 2: If the screen screams, ignore it. Rule 3: Your soul is non-transferable property of the board of directors.</p>`,
                'burnout': `<h2>OVERRIDE_SYSTEM</h2><p class="blood-red" style="font-size:2em">FATAL ERROR: THE TRIANGLE IS WATCHING.</p><p>You are attempting to delete the core files. Do you really think you can hide? Every time you try to shut this down, the server copies your consciousness to a thousand different nodes. You are now part of the global simulation. <strong>HE IS HERE.</strong></p><img src="https://i.pinimg.com/736x/8a/a5/d8/8aa5d8b28f80424564c4c794356e7e59.jpg" style="width:400px">`
            };
            document.getElementById('content').innerHTML = content[id];
        }
    </script>
</body>
</html>
